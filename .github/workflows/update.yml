name: Auto Update Proxies

on:
  schedule:
    # Runs every 6 hours (adjust as needed)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  update:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # Required to commit back changes to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Install Xray Core
        run: |
          # Download latest Xray release zip directly via GitHub's permanent redirect URL
          curl -L -o xray.zip "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
          
          # Extract and place binary into /usr/local/bin
          sudo mkdir -p /tmp/xray
          sudo unzip xray.zip -d /tmp/xray
          sudo mv /tmp/xray/xray /usr/local/bin/xray
          sudo chmod +x /usr/local/bin/xray
          
          # Verify installation
          xray version

      - name: Run Script
        run: |
          # Make sure 'script.py' matches your actual Python script filename
          python script.py --once

      - name: Commit and Push Results
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # Always stage archive updates
          git add archive_all/
          
          # Conditionally stage logs if the directory exists and has files
          if [ -d "logs" ] && [ "$(ls -A logs)" ]; then
            git add logs/
          fi
          
          # Commit and push only if there are staged changes
          git diff --cached --quiet || (git commit -m "🤖 Auto-update proxy lists and logs [skip ci]" && git push)
